name: reefish_mobile
description: Reefish fisherman mobile app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.1
  country_picker: ^2.0.28
  phone_numbers_parser: ^9.0.28
  supabase_flutter: 2.18.3
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  proj4dart: ^3.0.0
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  http: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
    - assets/untracked/
    - assets/geodata/
    - assets/geodata/klorofil_a/
  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DM-Sans-Variable.ttf
          weight: 400
        - asset: assets/fonts/DM-Sans-Variable.ttf
          weight: 500
        - asset: assets/fonts/DM-Sans-Variable.ttf
          weight: 600
        - asset: assets/fonts/DM-Sans-Variable.ttf
          weight: 700
          style: normal
