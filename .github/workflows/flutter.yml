name: Reefish mobile

on:
  push:
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    paths:
      - 'frontend/mobile/**'
      - '.github/workflows/flutter.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend/mobile

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --no-web-resources-cdn
      - uses: actions/upload-artifact@v4
        with:
          name: reefish-auth-web
          path: frontend/mobile/build/web
          retention-days: 7
