openapi: 3.1.0
info:
  title: Reefish Nelayan API
  version: 1.0.0
  description: |
    Owner: backend. These are the fisher (`nelayan`) endpoints from docs/AGENTS.md 12.B, core scope.
    Split rule: anything Supabase can do stays in Supabase; computation (ranking, fuel prediction, weather) runs in Go.

    **Supabase RPC** (`/rest/v1/rpc/api_*`)
    - Implemented in `backend/supabase/migrations/0006_nelayan.sql`.
    - From Flutter, call them with `supabase.rpc('api_me', params: {...})`.
    - Raw HTTP: `POST {SUPABASE_URL}/rest/v1/rpc/<name>` with the headers `apikey: <anon key>` and `Authorization: Bearer <access_token>`. The body holds named arguments.
    - The response is the JSON object directly, with no `{data}` envelope; `api_list_trips` returns `{data, meta, summary}`.
    - Errors come back as HTTP 400 with the PostgREST shape `{ code: "P0001", message: <CODE>, hint: <Indonesian message>, details: <JSON string or ""> }`. The supabase_flutter SDK surfaces them as `PostgrestException(code: 'P0001', message: CODE, hint, details)`.
    - An expired token gives HTTP 401 with code `PGRST301` or `PGRST303`.

    **Go** (`/api/v1/*`)
    - Implemented in `backend/internal/adapter/http/nelayan.go`.
    - Requires `Authorization: Bearer <access_token>` (the same Supabase JWT).
    - Success: `{ data, request_id }`. Errors: `{ error: { code, message, details? }, request_id }`.

    Adaptations from AGENTS.md:
    - **Roles and phone numbers:** the role is `nelayan`, not `fisher`. Phone numbers are `62…`, not `+62…`.
    - **Grid cells:** the grid is the ML `grid_cells` (`X…_Y…`), not `a{y}b{x}`. A point's `grid_id` is the nearest cell within 500 m.
    - **Pilot area:** a point counts as inside the pilot (`OUT_OF_PILOT` otherwise) when it is within 1 km of a grid cell. Ports and departure points get 5 km.
    - **Zones:** a zone is a set of grid cells with status `restricted` | `rehab` (see `map-zones-api.openapi.yaml`). `normal` means the point is in no zone. Fishing in a `rehab` zone counts as a violation, and catch in a `restricted` zone uses up its quota.
    - **Recommendations:** generated by a heuristic (`is_fallback: true`, `model_version: heuristic-0.1`). `area_condition` is always `healthy` because there is no fatigue data yet, and `heatmap_version` is always null.
    - **postTrip:** `recommendations` is null. Call `GET /api/v1/recommendations` after a trip.
    - **Weather:** sampled live from Open-Meteo, without `cell_key`. A missing value stays null, and risk becomes `unknown` when wind or waves are missing.

    Compatibility: new response fields may be added. The meaning of an existing field does not change without a new version.

servers:
  - url: https://upyahsecuorqghcghflg.supabase.co/rest/v1/rpc
    description: Supabase RPC
  - url: http://localhost:8080/api/v1
    description: Go service

security:
  - bearer: []

paths:
  /api_me:
    post:
      summary: me — profile, onboarding step, default boat, stats
      servers: [{ url: https://upyahsecuorqghcghflg.supabase.co/rest/v1/rpc }]
      requestBody: { content: { application/json: { schema: { type: object }, example: {} } } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "400": { $ref: "#/components/responses/RpcError" }

  /api_create_boat:
    post:
      summary: createBoat — once during onboarding (one boat per user)
      servers: [{ url: https://upyahsecuorqghcghflg.supabase.co/rest/v1/rpc }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p]
              properties: { p: { $ref: "#/components/schemas/BoatInput" } }
            example: { p: { name: KM Sumber Rejeki, engine_hp: 15, boat_length_m: 7, fuel_type: solar, home_port: { lat: -8.43, lng: 112.68 } } }
      responses:
        "200":
          description: Created; `is_default = true`
          content: { application/json: { schema: { $ref: "#/components/schemas/Boat" } } }
        "400":
          description: "`VALIDATION_ERROR` (details.fields), `BOAT_LIMIT_REACHED`, `OUT_OF_PILOT`, `FORBIDDEN`, `UNAUTHORIZED`"
          content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } }

  /api_update_boat:
    post:
      summary: updateBoat — partial; absent or null keeps the old value. Expires cached recommendations
      servers: [{ url: https://upyahsecuorqghcghflg.supabase.co/rest/v1/rpc }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_id, p]
              properties:
                p_id: { type: string, format: uuid }
                p: { $ref: "#/components/schemas/BoatInput" }
            example: { p_id: b1c2a3d4-0000-4000-8000-000000000001, p: { engine_hp: 20 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Boat" } } } }
        "400":
          description: "`VALIDATION_ERROR`, `BOAT_NOT_FOUND`, `OUT_OF_PILOT`"
          content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } }

  /api_post_trip:
    post:
      summary: postTrip — onboarding, manual, or end of sailing mode; idempotent on client_trip_id
      description: |
        Source rules:
        - `onboarding` is accepted only once (`ALREADY_ONBOARDED`).
        - `manual` and `sailing` require onboarding first (`ONBOARDING_REQUIRED`).
        - Every trip requires a default boat (`BOAT_REQUIRED`).

        Replay: sending the same `client_trip_id` again returns the stored result with `replay: true` and writes nothing.

        Derived values:
        - `grid_id` and `zone_at_time` for each fishing point
        - `distance_from_port_km` and `total_distance_km`: along the track when there is one, otherwise straight lines port → points → return
        - `fishing_hours`, `fuel_per_km`, `catch_per_liter`
        - `fuel_efficiency_pct` against the average of earlier trips (0 for the first trip)
        - `allocated_catch_kg`: the reported value when every point has one; otherwise split by duration when every point has one; otherwise split evenly
        - `zone_violation`
        - a snapshot of the boat specs
      servers: [{ url: https://upyahsecuorqghcghflg.supabase.co/rest/v1/rpc }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p]
              properties: { p: { $ref: "#/components/schemas/TripInput" } }
      responses:
        "200":
          description: Created, or replay
          content:
            application/json:
              schema:
                type: object
                required: [trip, recommendations, user, replay]
                properties:
                  trip: { $ref: "#/components/schemas/TripDetail" }
                  recommendations: { oneOf: [{ $ref: "#/components/schemas/RecommendationSet" }, { type: "null" }] }
                  user: { type: object, properties: { onboarded: { type: boolean } } }
                  replay: { type: boolean }
        "400":
          description: |
            `VALIDATION_ERROR` (details.fields; keys such as `fishing_points[0]` or `track[12]`), `BOAT_REQUIRED`, `ALREADY_ONBOARDED`, `ONBOARDING_REQUIRED`, `INVALID_TIME_RANGE` (details.points / details.track = indexes), `OUT_OF_PILOT` (details.points, details.departure, details.return_point)
          content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } }

  /api_list_trips:
    post:
      summary: getHistoryTrip
      servers: [{ url: https://upyahsecuorqghcghflg.supabase.co/rest/v1/rpc }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                p_page: { type: integer, default: 1, minimum: 1 }
                p_limit: { type: integer, default: 20, minimum: 1, maximum: 100 }
                p_from: { type: string, format: date, description: departed_at date in WIB }
                p_to: { type: string, format: date }
                p_source: { enum: [onboarding, manual, sailing] }
                p_sort: { enum: [-departed_at, departed_at, -catch_kg, -fuel_efficiency_pct], default: -departed_at }
      responses:
        "200":
          description: "`summary` covers the whole filter, not only this page"
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/TripSummary" } }
                  meta: { type: object, properties: { page: { type: integer }, limit: { type: integer }, total: { type: integer } } }
                  summary:
                    type: object
                    properties:
                      trip_count: { type: integer }
                      total_catch_kg: { type: number }
                      total_fuel_liters: { type: number }
                      avg_catch_per_liter: { type: [number, "null"] }

  /api_trip_detail:
    post:
      summary: getTripDetail
      servers: [{ url: https://upyahsecuorqghcghflg.supabase.co/rest/v1/rpc }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_id]
              properties:
                p_id: { type: string, format: uuid }
                p_track: { enum: [simplified, full, none], default: simplified, description: "simplified = Douglas-Peucker ~20 m" }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TripDetail" } } } }
        "400":
          description: "`TRIP_NOT_FOUND` (this includes another user's trip)"
          content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } }

  /api_mobile_config:
    post:
      summary: getMobileConfig — sailing mode and sync thresholds; works with only the anon key
      servers: [{ url: https://upyahsecuorqghcghflg.supabase.co/rest/v1/rpc }]
      security: []
      responses:
        "200":
          description: Same payload as AGENTS.md 12.B.9 `data`
          content: { application/json: { schema: { type: object } } }

  /recommendations:
    get:
      summary: getRecommendation (Go) — cached set, or a newly ranked one
      description: |
        Reuses the newest set for `for_date` while `valid_until` has not passed (6 hours). It regenerates when `refresh=true`, or when the boat was changed (`api_update_boat` expires the cache).
        Fuel = 2 × distance × the user's average fuel_per_km (or the configured default) × a weather factor from the forecast at the home port over the departure–return window.
      servers: [{ url: http://localhost:8080/api/v1 }]
      parameters:
        - { name: for_date, in: query, schema: { type: string, format: date }, description: "WIB; default today; at most +2 days" }
        - { name: refresh, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/RecommendationSet" }, request_id: { type: string } }
        "400": { $ref: "#/components/responses/GoError" }
        "401": { $ref: "#/components/responses/GoError" }
        "403": { $ref: "#/components/responses/GoError" }
        "409": { description: "`ONBOARDING_REQUIRED`", content: { application/json: { schema: { $ref: "#/components/schemas/GoError" } } } }
        "503": { $ref: "#/components/responses/GoError" }

  /weather/area:
    get:
      summary: getWeatherArea (Go, both roles) — 5×5 lattice of samples for wind arrows
      servers: [{ url: http://localhost:8080/api/v1 }]
      parameters:
        - { name: bbox, in: query, schema: { type: string, examples: ["112.25,-9.15,113.10,-8.35"] }, description: "minLng,minLat,maxLng,maxLat; default pilot AOI" }
        - { name: hours, in: query, schema: { type: integer, default: 0, minimum: 0, maximum: 48 }, description: hours ahead of the current hour }
      responses:
        "200":
          description: "`points[]` carry cell_key (cRR_CC), lat, lng and the WeatherHour fields"
          content:
            application/json:
              example: { data: { forecast_time: "2026-10-16T05:00:00Z", points: [{ cell_key: c00_00, lat: -9.07, lng: 112.335, time: "2026-10-16T05:00:00Z", weather_code: 2, weather_label: Berawan sebagian, temp_c: 28.1, wind_speed_ms: 4.2, wind_dir_deg: 120, wind_dir_label: TG, wave_height_m: 0.8, risk: low }] } }
        "400": { $ref: "#/components/responses/GoError" }
        "401": { $ref: "#/components/responses/GoError" }
        "503": { $ref: "#/components/responses/GoError" }

  /weather:
    get:
      summary: getWeatherInfo (Go) — forecast at one point
      servers: [{ url: http://localhost:8080/api/v1 }]
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: hours, in: query, schema: { type: integer, default: 24, minimum: 1, maximum: 48 } }
      responses:
        "200":
          description: "`current` = the current hour; `hourly` = the next `hours` hours; `warnings` = consecutive `high` hours merged"
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/WeatherReport" }, request_id: { type: string } }
        "400": { $ref: "#/components/responses/GoError" }
        "401": { $ref: "#/components/responses/GoError" }
        "422": { description: "`OUT_OF_PILOT`", content: { application/json: { schema: { $ref: "#/components/schemas/GoError" } } } }
        "503": { description: "`WEATHER_UNAVAILABLE` or `UPSTREAM_UNAVAILABLE`", content: { application/json: { schema: { $ref: "#/components/schemas/GoError" } } } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: "Supabase access_token from auth-login / auth-register" }

  responses:
    RpcError:
      description: "PostgREST error; `message` = API code (`UNAUTHORIZED`, `FORBIDDEN` for non-nelayan roles, …)"
      content: { application/json: { schema: { $ref: "#/components/schemas/RpcError" } } }
    GoError:
      description: Go error
      content: { application/json: { schema: { $ref: "#/components/schemas/GoError" } } }

  schemas:
    RpcError:
      type: object
      properties:
        code: { const: P0001 }
        message: { type: string, description: API error code }
        hint: { type: string, description: Indonesian message that may be shown to users }
        details: { type: string, description: 'JSON text, e.g. {"fields":{"engine_hp":"harus 1 sampai 500"}}, or ""' }
      example: { code: P0001, message: BOAT_LIMIT_REACHED, hint: Akun ini sudah punya kapal, details: "" }

    GoError:
      type: object
      properties:
        error:
          type: object
          required: [code, message]
          properties: { code: { type: string }, message: { type: string }, details: {} }
        request_id: { type: string }

    LatLng:
      type: object
      required: [lat, lng]
      properties: { lat: { type: number }, lng: { type: number } }

    BoatInput:
      type: object
      properties:
        name: { type: [string, "null"], maxLength: 60 }
        engine_hp: { type: number, minimum: 1, maximum: 500, description: required on create }
        boat_length_m: { type: number, minimum: 2, maximum: 30, description: required on create }
        fuel_type: { enum: [solar, bensin], default: solar }
        home_port: { $ref: "#/components/schemas/LatLng", description: "required on create; within 5 km of the pilot" }

    Boat:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        engine_hp: { type: number }
        boat_length_m: { type: number }
        fuel_type: { enum: [solar, bensin] }
        home_port: { $ref: "#/components/schemas/LatLng" }
        is_default: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, "null"] }
        phone: { type: [string, "null"], pattern: "^62[0-9]{8,13}$" }
        role: { const: nelayan }
        onboarded: { type: boolean }
        next_step: { enum: [boat, first_trip, done] }
        boat: { oneOf: [{ $ref: "#/components/schemas/Boat" }, { type: "null" }] }
        stats:
          type: object
          properties:
            trip_count: { type: integer }
            baseline_fuel_liters: { type: [number, "null"] }
            baseline_catch_kg: { type: [number, "null"] }
            last_trip_at: { type: [string, "null"], format: date-time }

    FishingPointInput:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number }
        lng: { type: number }
        started_at: { type: [string, "null"], format: date-time, description: ISO-8601 with an offset }
        ended_at: { type: [string, "null"], format: date-time }
        flag_source: { enum: [manual, user_confirmed, auto_timeout, rec_radius], default: manual }
        recommendation_id: { type: [string, "null"], format: uuid, description: required when flag_source = rec_radius; must be the user's own }
        reported_catch_kg: { type: [number, "null"], minimum: 0, maximum: 5000 }

    TrackPoint:
      type: object
      required: [seq, lat, lng, recorded_at]
      properties:
        seq: { type: integer, description: unique and increasing }
        lat: { type: number }
        lng: { type: number }
        recorded_at: { type: string, format: date-time }
        speed_ms: { type: [number, "null"] }
        accuracy_m: { type: [number, "null"] }

    TripInput:
      type: object
      required: [client_trip_id, source, departed_at, returned_at, fuel_liters, catch_kg, fishing_points]
      properties:
        client_trip_id: { type: string, format: uuid }
        source: { enum: [onboarding, manual, sailing] }
        departure: { $ref: "#/components/schemas/LatLng", description: default boat.home_port }
        return_point: { $ref: "#/components/schemas/LatLng", description: default departure }
        departed_at: { type: string, format: date-time }
        returned_at: { type: string, format: date-time, description: "> departed_at, at most 72 h later, at most now + 10 min" }
        fuel_liters: { type: number, exclusiveMinimum: 0, maximum: 500 }
        catch_kg: { type: number, minimum: 0, maximum: 5000 }
        fishing_points: { type: array, minItems: 1, maxItems: 50, items: { $ref: "#/components/schemas/FishingPointInput" } }
        track: { type: [array, "null"], maxItems: 5000, items: { $ref: "#/components/schemas/TrackPoint" }, description: "required (≥ 2) for sailing" }
        selected_recommendation_id: { type: [string, "null"], format: uuid }
        notes: { type: [string, "null"], maxLength: 500 }

    ZoneRef:
      type: object
      properties:
        id: { type: [string, "null"], format: uuid }
        name: { type: [string, "null"] }
        status: { enum: [normal, restricted, rehab] }

    TripSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { enum: [onboarding, manual, sailing] }
        departed_at: { type: string, format: date-time }
        returned_at: { type: string, format: date-time }
        duration_h: { type: number }
        fuel_liters: { type: number }
        catch_kg: { type: number }
        distance_from_port_km: { type: [number, "null"] }
        total_distance_km: { type: [number, "null"] }
        fuel_efficiency_pct: { type: [number, "null"] }
        catch_per_liter: { type: [number, "null"] }
        fishing_point_count: { type: integer }
        main_grid_id: { type: [string, "null"] }
        followed_recommendation_type: { type: [string, "null"] }
        zone_violation: { type: boolean }
        boat: { type: object, properties: { id: { type: string }, name: { type: [string, "null"] } } }

    TripDetail:
      allOf:
        - $ref: "#/components/schemas/TripSummary"
        - type: object
          properties:
            client_trip_id: { type: string, format: uuid }
            departure: { $ref: "#/components/schemas/LatLng" }
            return_point: { $ref: "#/components/schemas/LatLng" }
            fishing_hours: { type: [number, "null"] }
            fuel_per_km: { type: [number, "null"] }
            boat_snapshot: { type: object, properties: { engine_hp: { type: number }, boat_length_m: { type: number } } }
            fishing_points:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  lat: { type: number }
                  lng: { type: number }
                  grid_id: { type: [string, "null"] }
                  zone_at_time: { $ref: "#/components/schemas/ZoneRef" }
                  started_at: { type: [string, "null"] }
                  ended_at: { type: [string, "null"] }
                  fishing_hours: { type: [number, "null"] }
                  allocated_catch_kg: { type: number }
                  reported_catch_kg: { type: [number, "null"] }
                  flag_source: { type: string }
                  recommendation_id: { type: [string, "null"] }
            track: { type: [object, "null"], description: "GeoJSON LineString [lng, lat]" }
            selected_recommendation:
              type: [object, "null"]
              properties: { id: { type: string }, type: { type: string }, distance_to_point_m: { type: [number, "null"] } }
            notes: { type: [string, "null"] }
            created_at: { type: string, format: date-time }

    WeatherSummary:
      type: [object, "null"]
      properties:
        wind_speed_ms: { type: [number, "null"] }
        wind_dir_deg: { type: [number, "null"] }
        wind_dir_label: { type: [string, "null"], enum: [U, TL, T, TG, S, BD, B, BL, null] }
        wave_height_m: { type: [number, "null"] }
        temp_c: { type: [number, "null"] }
        risk: { enum: [low, medium, high, unknown], description: worst hour of the trip window }

    Recommendation:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { enum: [fuel_saving, catch_max, balanced, habitual] }
        grid_id: { type: string }
        point: { $ref: "#/components/schemas/LatLng" }
        zone: { $ref: "#/components/schemas/ZoneRef", description: "never rehab, never a restricted zone with its quota used up" }
        zone_rules:
          type: [object, "null"]
          description: only for restricted zones
          properties: { quota_remaining_kg: { type: [number, "null"] }, open_schedule: { type: [object, "null"] } }
        area_condition: { const: healthy }
        predicted_fuel_liters: { type: number }
        fuel_efficiency_pct: { type: [number, "null"] }
        predicted_catch_kg: { type: [number, "null"] }
        predicted_catch_range_kg: { type: [array, "null"], items: { type: number }, minItems: 2, maxItems: 2 }
        departure_time: { type: string, examples: ["04:30"] }
        return_time: { type: string, examples: ["11:00"] }
        for_date: { type: string, format: date }
        distance_from_port_km: { type: number }
        weather_summary: { $ref: "#/components/schemas/WeatherSummary" }
        confidence: { type: number }
        reason: { type: string }

    RecommendationSet:
      type: object
      properties:
        for_date: { type: string, format: date }
        generated_at: { type: string, format: date-time }
        valid_until: { type: string, format: date-time }
        source_trip_id: { type: [string, "null"], format: uuid }
        boat_id: { type: string, format: uuid }
        baseline_fuel_liters: { type: [number, "null"] }
        heatmap_version: { type: "null" }
        model_version: { type: string }
        is_fallback: { type: boolean }
        items: { type: array, items: { $ref: "#/components/schemas/Recommendation" }, description: "order: fuel_saving, catch_max, balanced, habitual" }
        unavailable_types:
          type: array
          items: { type: object, properties: { type: { type: string }, reason_code: { const: NO_VALID_CANDIDATE } } }

    WeatherHour:
      type: object
      properties:
        time: { type: string, format: date-time }
        weather_code: { type: [integer, "null"] }
        weather_label: { type: string, description: only on current }
        temp_c: { type: [number, "null"] }
        wind_speed_ms: { type: [number, "null"] }
        wind_dir_deg: { type: [number, "null"] }
        wind_dir_label: { type: [string, "null"] }
        wave_height_m: { type: [number, "null"] }
        risk: { enum: [low, medium, high, unknown] }

    WeatherReport:
      type: object
      properties:
        location: { $ref: "#/components/schemas/LatLng" }
        fetched_at: { type: string, format: date-time }
        current: { $ref: "#/components/schemas/WeatherHour" }
        hourly: { type: array, items: { $ref: "#/components/schemas/WeatherHour" } }
        warnings:
          type: array
          items: { type: object, properties: { from: { type: string }, to: { type: string }, reason: { type: string } } }
