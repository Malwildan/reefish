openapi: 3.1.0
info:
  title: Nelayan & Konservasi Karang API
  version: 1.0.0
  description: |
    Kontrak untuk frontend. Dua server:
    - Route service (Go, `cmd/api`): rute pergi-pulang + estimasi BBM, mode `static_snapshot`, hasil `simulation_only`.
    - Supabase (PostgREST): data cluster ML, zona konservasi, legenda.

    Semua endpoint butuh JWT Supabase user di `Authorization: Bearer <token>`.
    Endpoint Supabase juga butuh header `apikey: <anon key>`.
    Satuan: meter, m/s, liter, L/jam, detik. Waktu RFC 3339 UTC. GeoJSON `[lon, lat]`.
    Arah angin `from`, arah arus `to`, derajat dari utara sejati searah jarum jam.

servers:
  - url: http://localhost:8080
    description: Route service (Go)

security:
  - bearerAuth: []

paths:
  /health/live:
    get:
      summary: Proses hidup
      security: []
      responses:
        "200": { description: OK }

  /v1/routes:
    post:
      summary: Hitung rute pergi-pulang dengan estimasi BBM
      description: |
        Sinkron. Jalur dicari di grid laut 500 m dengan Dijkstra, menghindari daratan dan zona `closed`
        yang aktif di jendela perjalanan. Angin/arus/gelombang diambil dari Open-Meteo di titik `destination`
        dan dianggap seragam untuk seluruh perjalanan.
      operationId: createRoute
      parameters:
        - $ref: "#/components/parameters/RequestID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RouteRequest" }
            example:
              origin: { lat: -8.43, lon: 112.68 }
              destination: { lat: -8.5, lon: 112.7 }
              return_to: { lat: -8.43, lon: 112.68 }
              depart_at: "2026-10-17T03:00:00Z"
              latest_return_at: "2026-10-17T09:00:00Z"
              calculation_mode: static_snapshot
              vessel:
                stw_min_mps: 2
                stw_max_mps: 4
                fuel_curves:
                  - load_class: light
                    points:
                      - { stw_mps: 2, rate_lph: 2.8 }
                      - { stw_mps: 3, rate_lph: 5.4 }
                      - { stw_mps: 4, rate_lph: 9.6 }
                  - load_class: loaded
                    points:
                      - { stw_mps: 2, rate_lph: 3.2 }
                      - { stw_mps: 3, rate_lph: 6.0 }
                      - { stw_mps: 4, rate_lph: 10.8 }
              spot_activity: { duration_s: 3600, position_mode: station_keeping, fuel_rate_lph: 2.0 }
              outbound: { stw_mps: 3, load_class: light }
              inbound: { stw_mps: 3, load_class: loaded }
              fuel_budget: { usable_at_departure_l: 40, reserve_fixed_l: 8, reserve_fraction: 0.2 }
              safety: { min_progress_mps: 0.5, max_wind_gust_mps: 12, max_significant_wave_height_m: 2 }
      responses:
        "200":
          description: Rute layak dalam model
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RouteResponse" }
        "400":
          description: "`INVALID_JSON`, `UNKNOWN_FIELD`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: "`UNAUTHENTICATED`: token tidak ada, tidak valid, atau kedaluwarsa"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: |
            Permintaan tidak dapat direncanakan. Kode:
            `INVALID_COORDINATES`, `INVALID_TIME_WINDOW`, `INVALID_STW_RANGE`, `INVALID_SPOT_ACTIVITY`,
            `INVALID_FUEL_BUDGET`, `INVALID_FUEL_MODEL`, `INVALID_SAFETY_POLICY`, `MODE_NOT_AVAILABLE`,
            `FORECAST_HORIZON_INSUFFICIENT`, `ENVIRONMENT_COVERAGE_GAP`, `SAFETY_LIMIT_EXCEEDED`,
            `POINT_IN_CLOSED_ZONE`, `NO_ROUTE_IN_SEARCH_GRAPH`, `FUEL_BUDGET_INFEASIBLE`, `DEADLINE_INFEASIBLE`.
            Untuk `FUEL_BUDGET_INFEASIBLE` dan `DEADLINE_INFEASIBLE`, `details` berisi objek `RouteSummary`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "503":
          description: "`PROVIDER_UNAVAILABLE`: Supabase atau Open-Meteo gagal; boleh dicoba ulang"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /rest/v1/rpc/get_fishing_spots:
    servers:
      - url: https://{ref}.supabase.co
        variables: { ref: { default: your-project-ref } }
    post:
      summary: Spot tangkap untuk nelayan (Supabase RPC)
      description: Titik di zona `closed` aktif dibuang; titik di zona `limited` diberi `zone_status` dan `max_catch_kg`. Urut `potential_score` turun.
      operationId: getFishingSpots
      parameters:
        - $ref: "#/components/parameters/ApiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_period]
              additionalProperties: false
              properties:
                p_period: { $ref: "#/components/schemas/Period" }
                p_min_level: { type: integer, minimum: 1, maximum: 5, default: 4 }
      responses:
        "200":
          description: GeoJSON FeatureCollection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FishingSpotCollection" }

  /rest/v1/rpc/get_clusters:
    servers:
      - url: https://{ref}.supabase.co
        variables: { ref: { default: your-project-ref } }
    post:
      summary: Semua titik cluster satu periode (Supabase RPC, dashboard konservatif)
      operationId: getClusters
      parameters:
        - $ref: "#/components/parameters/ApiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [p_period]
              additionalProperties: false
              properties:
                p_period: { $ref: "#/components/schemas/Period" }
                p_min_level: { type: integer, minimum: 1, maximum: 5, default: 1 }
      responses:
        "200":
          description: GeoJSON FeatureCollection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClusterCollection" }

  /rest/v1/cluster_levels:
    servers:
      - url: https://{ref}.supabase.co
        variables: { ref: { default: your-project-ref } }
    get:
      summary: Legenda level cluster
      operationId: listClusterLevels
      parameters:
        - $ref: "#/components/parameters/ApiKey"
      responses:
        "200":
          description: 5 baris, level 1–5
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ClusterLevel" }

  /rest/v1/zones:
    servers:
      - url: https://{ref}.supabase.co
        variables: { ref: { default: your-project-ref } }
    get:
      summary: Daftar zona konservasi
      description: "Filter PostgREST, mis. `?select=*&status=eq.closed`. Gunakan kolom `geojson` untuk peta."
      operationId: listZones
      parameters:
        - $ref: "#/components/parameters/ApiKey"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
    post:
      summary: Buat zona (hanya role konservatif; RLS menolak role lain)
      description: "Kirim header `Prefer: return=representation` untuk mendapat baris yang dibuat. PATCH/DELETE memakai filter `?id=eq.<uuid>`."
      operationId: createZone
      parameters:
        - $ref: "#/components/parameters/ApiKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ZoneInput" }
            example:
              name: Karang Sendang Biru
              status: closed
              notes: Pemulihan karang
              valid_from: "2026-10-16"
              geom: "POLYGON((112.67 -8.44, 112.69 -8.44, 112.69 -8.42, 112.67 -8.42, 112.67 -8.44))"
      responses:
        "201":
          description: Dibuat
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Zone" }
        "403": { description: Bukan konservatif (RLS) }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT, description: Access token Supabase Auth }

  parameters:
    RequestID:
      name: X-Request-ID
      in: header
      required: false
      schema: { type: string, maxLength: 64 }
    ApiKey:
      name: apikey
      in: header
      required: true
      schema: { type: string }
      description: Supabase anon key

  headers:
    RequestID:
      schema: { type: string }

  schemas:
    Period:
      type: string
      pattern: "^\\d{4}-\\d{2}$"
      examples: ["2025-12"]

    Position:
      type: object
      required: [lat, lon]
      additionalProperties: false
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lon: { type: number, minimum: -180, maximum: 180 }

    CurvePoint:
      type: object
      required: [stw_mps, rate_lph]
      additionalProperties: false
      properties:
        stw_mps: { type: number, exclusiveMinimum: 0 }
        rate_lph: { type: number, exclusiveMinimum: 0 }

    Phase:
      type: object
      required: [stw_mps, load_class]
      additionalProperties: false
      properties:
        stw_mps: { type: number, exclusiveMinimum: 0, description: Kecepatan terhadap air (STW), bukan SOG GPS }
        load_class: { type: string, description: Harus ada di vessel.fuel_curves }

    RouteRequest:
      type: object
      required: [origin, destination, return_to, depart_at, latest_return_at, vessel, spot_activity, outbound, inbound, fuel_budget, safety]
      additionalProperties: false
      properties:
        origin: { $ref: "#/components/schemas/Position" }
        destination: { $ref: "#/components/schemas/Position" }
        return_to: { $ref: "#/components/schemas/Position" }
        depart_at: { type: string, format: date-time }
        latest_return_at: { type: string, format: date-time, description: "Harus setelah depart_at; jendela maks 48 jam" }
        calculation_mode: { type: string, enum: [static_snapshot], default: static_snapshot }
        vessel:
          type: object
          required: [stw_min_mps, stw_max_mps, fuel_curves]
          additionalProperties: false
          properties:
            stw_min_mps: { type: number, exclusiveMinimum: 0 }
            stw_max_mps: { type: number, exclusiveMinimum: 0 }
            fuel_curves:
              type: array
              minItems: 1
              items:
                type: object
                required: [load_class, points]
                additionalProperties: false
                properties:
                  load_class: { type: string }
                  points:
                    type: array
                    minItems: 1
                    items: { $ref: "#/components/schemas/CurvePoint" }
                    description: Diinterpolasi linear; STW di luar rentang ditolak
        spot_activity:
          type: object
          required: [duration_s, position_mode, fuel_rate_lph]
          additionalProperties: false
          properties:
            duration_s: { type: number, minimum: 0, maximum: 86400 }
            position_mode: { type: string, enum: [station_keeping] }
            fuel_rate_lph: { type: number, minimum: 0 }
        outbound: { $ref: "#/components/schemas/Phase" }
        inbound: { $ref: "#/components/schemas/Phase" }
        fuel_budget:
          type: object
          required: [usable_at_departure_l, reserve_fixed_l, reserve_fraction]
          additionalProperties: false
          properties:
            usable_at_departure_l: { type: number, exclusiveMinimum: 0, description: BBM yang bisa dipakai saat berangkat, bukan kapasitas tangki }
            reserve_fixed_l: { type: number, minimum: 0 }
            reserve_fraction: { type: number, minimum: 0, maximum: 1 }
        safety:
          type: object
          required: [min_progress_mps]
          additionalProperties: false
          description: Ambang dari kebijakan kapal/area; tanpa default universal. Ambang cuaca yang tidak diisi memicu warning `WEATHER_SAFETY_NOT_ASSESSED`.
          properties:
            min_progress_mps: { type: number, exclusiveMinimum: 0 }
            max_wind_gust_mps: { type: number, minimum: 0 }
            max_significant_wave_height_m: { type: number, minimum: 0 }

    LineString:
      type: object
      required: [type, coordinates]
      additionalProperties: false
      properties:
        type: { const: LineString }
        coordinates:
          type: array
          minItems: 2
          items: { type: array, prefixItems: [{ type: number }, { type: number }], minItems: 2, maxItems: 2 }

    Leg:
      type: object
      required: [phase, departure_at, arrival_at, distance_m, duration_s, estimated_fuel_l, geometry]
      additionalProperties: false
      properties:
        phase: { type: string, enum: [outbound, inbound] }
        departure_at: { type: string, format: date-time }
        arrival_at: { type: string, format: date-time }
        distance_m: { type: number }
        duration_s: { type: number }
        estimated_fuel_l: { type: number }
        geometry: { $ref: "#/components/schemas/LineString" }

    RouteSummary:
      type: object
      additionalProperties: false
      required: [distance_m, transit_duration_s, spot_duration_s, total_duration_s, estimated_fuel_outbound_l, estimated_fuel_spot_l,
        estimated_fuel_inbound_l, estimated_fuel_other_l, estimated_fuel_total_l, planning_fuel_l, reserve_l,
        fuel_required_with_reserve_l, usable_fuel_at_departure_l, nominal_budget_pass, return_at]
      properties:
        distance_m: { type: number }
        transit_duration_s: { type: number }
        spot_duration_s: { type: number }
        total_duration_s: { type: number }
        estimated_fuel_outbound_l: { type: number }
        estimated_fuel_spot_l: { type: number }
        estimated_fuel_inbound_l: { type: number }
        estimated_fuel_other_l: { type: number }
        estimated_fuel_total_l: { type: number }
        planning_fuel_l: { type: number }
        reserve_l: { type: number, description: "max(reserve_fixed_l, reserve_fraction × usable_at_departure_l)" }
        fuel_required_with_reserve_l: { type: number }
        usable_fuel_at_departure_l: { type: number }
        nominal_budget_pass: { type: boolean }
        return_at: { type: string, format: date-time }

    Environment:
      type: object
      additionalProperties: false
      required: [wind_speed_mps, wind_from_deg, current_speed_mps, current_to_deg, max_wind_gust_mps, max_significant_wave_height_m,
        static_reference_at, provider, sampled_lat, sampled_lon, fetched_at]
      properties:
        wind_speed_mps: { type: number }
        wind_from_deg: { type: number }
        current_speed_mps: { type: number }
        current_to_deg: { type: number }
        max_wind_gust_mps: { type: number, description: Maksimum selama jendela perjalanan }
        max_significant_wave_height_m: { type: number, description: Maksimum Hs selama jendela perjalanan }
        static_reference_at: { type: string, format: date-time }
        provider: { type: string }
        sampled_lat: { type: number }
        sampled_lon: { type: number }
        fetched_at: { type: string, format: date-time }

    RouteResult:
      type: object
      additionalProperties: false
      required: [status, planning_mode, eligibility, calculation_mode, objective, search, summary, legs, environment, comparison, quality, assumptions]
      properties:
        status: { const: succeeded }
        planning_mode: { const: simulation }
        eligibility: { const: simulation_only, description: Bukan persetujuan operasi di laut }
        calculation_mode: { const: static_snapshot }
        objective: { const: fuel }
        search:
          type: object
          additionalProperties: false
          required: [algorithm, heuristic, state_model, optimality, scope]
          properties:
            algorithm: { const: dijkstra }
            heuristic: { const: zero }
            state_model: { type: string }
            optimality: { type: string }
            scope: { type: string }
        summary: { $ref: "#/components/schemas/RouteSummary" }
        legs:
          type: array
          minItems: 2
          maxItems: 2
          items: { $ref: "#/components/schemas/Leg" }
        environment: { $ref: "#/components/schemas/Environment" }
        comparison:
          type: object
          additionalProperties: false
          required: [model_estimated_fuel_reduction_pct, measured_fuel_saving_pct, reason]
          properties:
            model_estimated_fuel_reduction_pct: { type: [number, "null"] }
            measured_fuel_saving_pct: { type: [number, "null"], description: Selalu null sampai ada pengukuran lapangan }
            reason: { type: string }
        quality:
          type: object
          additionalProperties: false
          required: [fuel_model_status, environment_source, safety_assessment, uncertainty, warnings]
          properties:
            fuel_model_status: { type: string, enum: [uncalibrated, calibrated, validated] }
            environment_source: { type: string }
            safety_assessment: { type: string }
            uncertainty:
              type: object
              additionalProperties: false
              required: [method, scenario_range_l]
              properties:
                method: { type: string }
                scenario_range_l: { type: [array, "null"] }
            warnings:
              type: array
              items:
                type: string
                enum: [STATIC_ENVIRONMENT_FOR_ENTIRE_TRIP, UNIFORM_FIELD_ASSUMPTION, FUEL_MODEL_UNCALIBRATED,
                  WIND_WAVE_FUEL_CORRECTION_UNAVAILABLE, CONNECTOR_LAND_NOT_CHECKED, WEATHER_SAFETY_NOT_ASSESSED]
        assumptions:
          type: array
          items: { type: string }

    RouteResponse:
      type: object
      additionalProperties: false
      required: [route, request_id]
      properties:
        route: { $ref: "#/components/schemas/RouteResult" }
        request_id: { type: string }

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error, request_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
        request_id: { type: string }

    PointGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type: { const: Point }
        coordinates: { type: array, minItems: 2, maxItems: 2, items: { type: number } }

    FishingSpotCollection:
      type: object
      required: [type, features]
      properties:
        type: { const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: { const: Feature }
              id: { type: string, description: grid_id }
              geometry: { $ref: "#/components/schemas/PointGeometry" }
              properties:
                type: object
                additionalProperties: false
                required: [grid_id, level, potential_score, sst, chlor_a, depth_m, zone_status, max_catch_kg]
                properties:
                  grid_id: { type: string }
                  level: { type: integer, minimum: 1, maximum: 5 }
                  potential_score: { type: number }
                  sst: { type: [number, "null"], description: Suhu permukaan laut (°C) }
                  chlor_a: { type: [number, "null"], description: Klorofil-a (mg/m³) }
                  depth_m: { type: [number, "null"] }
                  zone_status: { type: string, enum: [open, limited] }
                  max_catch_kg: { type: [number, "null"] }

    ClusterCollection:
      type: object
      required: [type, features]
      properties:
        type: { const: FeatureCollection }
        features:
          type: array
          items:
            type: object
            required: [type, id, geometry, properties]
            properties:
              type: { const: Feature }
              id: { type: string }
              geometry: { $ref: "#/components/schemas/PointGeometry" }
              properties:
                type: object
                additionalProperties: false
                required: [grid_id, cluster_id, level, potential_score, sst, chlor_a, depth_m, imputed]
                properties:
                  grid_id: { type: string }
                  cluster_id: { type: integer }
                  level: { type: integer, minimum: 1, maximum: 5 }
                  potential_score: { type: number }
                  sst: { type: [number, "null"] }
                  chlor_a: { type: [number, "null"] }
                  depth_m: { type: [number, "null"] }
                  imputed: { type: boolean, description: Fitur hasil imputasi, bukan observasi }

    ClusterLevel:
      type: object
      required: [level, label, color]
      properties:
        level: { type: integer }
        label: { type: string, examples: [Sangat Tinggi] }
        color: { type: string, examples: ["#fde725"] }

    ZoneStatus:
      type: string
      enum: [open, limited, closed]
      description: "`limited` = boleh dengan batas `max_catch_kg`; `closed` = dilarang total dan diblokir untuk rute"

    ZoneInput:
      type: object
      required: [name, status, geom]
      additionalProperties: false
      properties:
        name: { type: string }
        status: { $ref: "#/components/schemas/ZoneStatus" }
        max_catch_kg: { type: [number, "null"], minimum: 0 }
        notes: { type: [string, "null"] }
        valid_from: { type: string, format: date, description: Default hari ini }
        valid_to: { type: [string, "null"], format: date }
        geom: { type: string, description: "WKT POLYGON, koordinat `lon lat`, ring tertutup" }

    Zone:
      type: object
      required: [id, name, status, valid_from, geojson, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { $ref: "#/components/schemas/ZoneStatus" }
        max_catch_kg: { type: [number, "null"] }
        notes: { type: [string, "null"] }
        valid_from: { type: string, format: date }
        valid_to: { type: [string, "null"], format: date }
        geom: { type: string, description: Hex EWKB; pakai `geojson` untuk tampilan }
        geojson: { type: object, description: GeoJSON Polygon }
        created_by: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
