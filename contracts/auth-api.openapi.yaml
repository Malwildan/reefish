openapi: 3.1.0
info:
  title: Reefish Auth API
  version: 1.0.0
  description: |
    Pemilik: backend. Register dan login dengan nomor telepon + password, tanpa OTP.
    Implementasi: Supabase Edge Functions `backend/supabase/functions/auth-register` dan `auth-login`.

    - Nomor telepon dinormalisasi ke `62XXXXXXXXXX`: spasi, `-`, dan kurung dibuang; awalan `+62` atau `0` diganti `62`.
      Panjang total 10–15 digit. Kepemilikan nomor tidak diverifikasi.
    - Password minimal 8 karakter dan wajib berisi huruf kapital, angka, dan simbol. Disimpan sebagai hash bcrypt oleh Supabase Auth.
    - `session.access_token` adalah JWT Supabase. Pakai sebagai `Authorization: Bearer` ke Supabase dan route service,
      atau berikan ke SDK via `supabase.auth.setSession({ access_token, refresh_token })`.

    Kompatibilitas: field baru boleh ditambahkan pada respons; field yang ada tidak diubah maknanya tanpa versi baru.

servers:
  - url: https://upyahsecuorqghcghflg.supabase.co/functions/v1

paths:
  /auth-register:
    post:
      summary: Daftar akun baru dan langsung login
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, examples: ["0812-3456-7890"] }
                password: { type: string, minLength: 8 }
                full_name: { type: [string, "null"], maxLength: 100 }
            example: { phone: "081234567890", password: "Rahasia#123", full_name: Budi }
      responses:
        "201":
          description: Akun dibuat, role awal `nelayan`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "409":
          description: "`PHONE_TAKEN`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: { code: PHONE_TAKEN, message: Nomor telepon sudah terdaftar } }
        "422":
          description: "`INVALID_PHONE` atau `WEAK_PASSWORD` (`details` berisi aturan yang gagal)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example:
                error:
                  code: WEAK_PASSWORD
                  message: Password belum memenuhi syarat
                  details: [Harus mengandung huruf kapital, Harus mengandung simbol]
        "500": { $ref: "#/components/responses/Error" }

  /auth-login:
    post:
      summary: Login dengan nomor telepon dan password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string }
                password: { type: string }
            example: { phone: "+62 812 3456 7890", password: "Rahasia#123" }
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: "`INVALID_CREDENTIALS`: nomor tidak terdaftar, format salah, atau password salah (sengaja tidak dibedakan)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
              example: { error: { code: INVALID_CREDENTIALS, message: Nomor telepon atau password salah } }
        "429": { $ref: "#/components/responses/Error" }
        "500": { $ref: "#/components/responses/Error" }

components:
  responses:
    Error:
      description: "`INVALID_JSON` (400), `LOGIN_FAILED` (429/500), `REGISTER_FAILED` (500)"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    AuthResponse:
      type: object
      required: [user, session]
      properties:
        user:
          type: object
          required: [id, phone, full_name]
          properties:
            id: { type: string, format: uuid }
            phone: { type: string, pattern: "^62[0-9]{8,13}$" }
            full_name: { type: [string, "null"] }
        session:
          type: object
          required: [access_token, refresh_token, expires_at]
          properties:
            access_token: { type: string }
            refresh_token: { type: string }
            expires_at: { type: [integer, "null"], description: Unix detik }

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string, description: Bahasa Indonesia, boleh ditampilkan ke pengguna }
            details: {}
